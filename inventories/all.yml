---
all:
  children:
    default:
      hosts: localhost
      vars:
        ansible_connection: local
        # Pin the interpreter: discovery picks up whatever python is first on PATH, which
        # with mise active is a version-manager one. Modules then run under a toolchain
        # that is not the repo's, and under become they fail outright.
        ansible_python_interpreter: "{{ playbook_dir }}/.venv/bin/python"
        group: ubuntu
        ansible_shell_executable: /bin/bash
        # Ubuntu 25.10+ points `sudo` at sudo-rs, which wraps the `-p` prompt as
        # "[sudo: <prompt>] Password:" so Ansible never sees its prompt and times out.
        # Classic sudo stays installed as sudo.ws; with a local connection the
        # controller-side `exists` test checks the target itself.
        # TODO(https://github.com/ansible/ansible/pull/87622): drop once ansible-core
        # in uv.lock ships the sudo-rs prompt fix.
        ansible_become_exe: "{{ 'sudo.ws' if '/usr/bin/sudo.ws' is exists else 'sudo' }}"
        workdir: "~"
