---
# The 1password package's postinst rewrites the apt source as 1password.sources with its own
# keyring and comments out 1password.list. Mirror exactly what it writes so both agree;
# a second definition with a different Signed-By makes apt refuse to read any source.
- name: Add apt signing key
  become: true
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsS https://downloads.1password.com/linux/keys/1password.asc \
        | gpg --batch --yes --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg
  changed_when: false
  tags:
    - config-tools
    - config-onepassword

- name: Remove legacy apt source files
  become: true
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - 1password.list
    - 1password.list.distUpgrade
  tags:
    - config-tools
    - config-onepassword

- name: Add apt source
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/1password.sources
    mode: "0644"
    content: |
      # This file is automatically added and configured by the 1Password package. Modifications may be overwritten.
      Types: deb
      URIs: https://downloads.1password.com/linux/debian/{{ onepassword_arch_result.stdout }}
      Suites: stable
      Components: main
      Architectures: {{ onepassword_arch_result.stdout }}
      Signed-By: /usr/share/keyrings/1password-archive-keyring.gpg
  tags:
    - config-tools
    - config-onepassword

- name: Mkdir for Debsig-Verify policy
  become: true
  ansible.builtin.file:
    path: /etc/debsig/policies/AC2D62742012EA22/
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - config-tools
    - config-onepassword

- name: Download Debsig Verify Policy
  become: true
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/debian/debsig/1password.pol
    dest: /etc/debsig/policies/AC2D62742012EA22/1password.pol
    mode: "0644"
  tags:
    - config-tools
    - config-onepassword

- name: Mkdir for Debsig-Verify keyring
  become: true
  ansible.builtin.file:
    path: /etc/debsig/keyrings/AC2D62742012EA22
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - config-tools
    - config-onepassword

- name: Add apt signing key for Debsig-Verify
  become: true
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/keys/1password.asc
    dest: /etc/debsig/keyrings/AC2D62742012EA22/debsig.gpg
    mode: "0644"
    force: true
  tags:
    - config-tools
    - config-onepassword

- name: Install 1Password App/CLI
  become: true
  ansible.builtin.apt:
    name:
      - 1password
      - 1password-cli
    state: present
    update_cache: true
  when: not ansible_check_mode
  tags:
    - config-tools
    - config-onepassword
