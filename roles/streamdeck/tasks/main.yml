---
- name: Get ansible_user home directory (Linux)
  ansible.builtin.shell: 'set -o pipefail && getent passwd "{{ ansible_user }}" | cut -d: -f6'
  register: streamdeck_ansible_home_result_linux
  changed_when: false
  when:
    - ansible_facts.system == "Linux"
  tags:
    - config-tools
    - config-streamdeck

- name: Set the fact for the other scripts to use
  ansible.builtin.set_fact:
    streamdeck_ansible_home: "{{ streamdeck_ansible_home_result_linux.stdout }}"
  changed_when: false
  when: streamdeck_ansible_home_result_linux.stdout is defined
  tags:
    - config-tools
    - config-streamdeck

# streamdeck-linux-gui, Window Calls and ydotool are Linux/GNOME only.
- name: For debian
  ansible.builtin.import_tasks: debian.yml
  when:
    - ansible_facts.os_family == "Debian"

- name: For archlinux
  ansible.builtin.import_tasks: archlinux.yml
  when:
    - ansible_facts.os_family == "Archlinux"

- name: For linux
  ansible.builtin.import_tasks: linux.yml
  when:
    - ansible_facts.system == "Linux"
