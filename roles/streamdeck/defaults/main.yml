---
# version_tag pins Window Calls v21 (GNOME Shell 45-50).
# Look up the tag for a newer release via
# https://extensions.gnome.org/extension-info/?uuid=window-calls@domandoman.xyz&shell_version=<major>
streamdeck_window_calls_uuid: window-calls@domandoman.xyz
streamdeck_window_calls_version_tag: 69219

# Applied to every Stream Deck attached when the playbook runs.
streamdeck_deck_settings:
  display_timeout: 1800
  brightness: 99
  brightness_dimmed: 0
  rotation: 0
  page: 0

# Only assigned buttons are listed; streamdeck-ui fills the rest with blanks.
# `icon` is a file under files/icons, `script` a file under files/ installed
# to ~/.local/share/streamdeck-ui/scripts, and `args` the arguments passed to it.
streamdeck_buttons:
  - button: 0
    icon: logo-1password.png
    script: bring-window-active-desktop
    args:
      - com.onepassword.OnePassword  # wm_class, as in the Window Calls List output
      - 1password  # launch command, run when no window exists
  - button: 1
    icon: logo-brave.png
    script: bring-window-active-desktop
    args:
      - brave  # wm_class
      - brave  # launch command
  - button: 2
    icon: logo-spotify.png
    script: bring-window-active-desktop
    args:
      - Spotify  # wm_class
      # Arch ships the client through spotify-launcher, which installs no `spotify` command
      - "{{ 'spotify-launcher' if ansible_facts.os_family == 'Archlinux' else 'spotify' }}"
  - button: 3
    icon: logo-meet.png
    script: meet-toggle-mute
  # GNOME workspace left / right
  - button: 13
    icon: workspace-left.png
    keys: ctrl+alt+left
  - button: 14
    icon: workspace-right.png
    keys: ctrl+alt+right
