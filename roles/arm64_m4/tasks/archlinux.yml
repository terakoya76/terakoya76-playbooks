---
- name: Install dependencies
  ansible.builtin.import_role:
    name: packages
    tasks_from: archlinux_pacman_install
  vars:
    packages_archlinux_names:
      - minicom
      - libusb
      - sdl2-compat
  tags:
    - config-iot
    - config-arm64-m4

# Arch owns serial devices by uucp; it has no dialout group.
- name: Join uucp group for USB serial
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: uucp
    append: true
  tags:
    - config-iot
    - config-arm64-m4
