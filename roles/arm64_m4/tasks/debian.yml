---
- name: Install dependencies
  become: true
  ansible.builtin.apt:
    name:
      - minicom
      - libusb-1.0-0-dev
      - libsdl2-dev
    state: present
  tags:
    - config-iot
    - config-arm64-m4

- name: Join dialouot group for USB serial
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: dialout
    append: true
  tags:
    - config-iot
    - config-arm64-m4

# reboot here
