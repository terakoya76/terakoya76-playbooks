---
# herdr itself is installed by mise; this adds its agent skill for Claude Code.
# https://herdr.dev/docs/agent-skill/
- name: Install herdr agent skill
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command:
    cmd: mise exec node npm:skills -- skills add herdrdev/herdr --skill herdr --global --yes --agent claude-code
    chdir: "{{ tools_ansible_home }}"
  changed_when: false
  tags:
    - config-tools

- name: Download xpanes
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/greymd/tmux-xpanes/v4.1.1/bin/xpanes
    dest: /tmp/xpanes
    mode: "0755"
  tags:
    - config-tools

- name: Install xpanes
  become: true
  ansible.builtin.command: install -m 0755 /tmp/xpanes /usr/local/bin/xpanes
  changed_when: false
  tags:
    - config-tools

