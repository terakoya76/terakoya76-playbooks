---
# The AUR has no terraform-tools component, so only the CLI is installed here.
- name: Install google-cloud-cli
  ansible.builtin.import_role:
    name: packages
    tasks_from: archlinux_aur_install
  vars:
    packages_archlinux_names:
      - google-cloud-cli
  when: not ansible_check_mode
  tags:
    - config-tools
    - config-gcp
