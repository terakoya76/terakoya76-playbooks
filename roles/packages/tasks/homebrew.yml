---
- name: Install CLT
  become: true
  # https://scrapbox.io/r-hanafusa/xcode-select:_error:_tool_'xcodebuild'_requires_Xcode,_but...%E3%81%A8%E3%81%84%E3%81%86%E3%82%A8%E3%83%A9%E3%83%BC%E3%81%8C%E5%87%BA%E3%81%9F%E3%81%A8%E3%81%8D%E3%81%AE%E5%AF%BE%E5%87%A6%E6%B3%95
  ansible.builtin.command: xcode-select -s /Applications/Xcode.app/Contents/Developer
  changed_when: false
  tags:
    - config-base
    - config-packages

- name: Brew Tap
  become: true
  become_user: "{{ ansible_user }}"
  community.general.homebrew_tap:
    name:
      - homebrew/bundle
      - homebrew/services
      - ktr0731/evans
      - osx-cross/avr
      - PX4/homebrew-px4
      - universal-ctags/universal-ctags
    state: present
  tags:
    - config-base
    - config-packages

# Homebrew 7 refuses to load formulae from non-official taps until they are trusted.
# Tap names below are the normalized form `brew tap` reports, so they match trust.json.
- name: Brew Trust Check
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: brew trust --json v1
  register: packages_brew_trust_result
  changed_when: false
  check_mode: false
  tags:
    - config-base
    - config-packages

- name: Brew Trust
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: brew trust --tap {{ item }}
  with_items:
    - ktr0731/evans
    - osx-cross/avr
    - px4/px4
    - universal-ctags/universal-ctags
  when: item not in (packages_brew_trust_result.stdout | from_json).taps
  changed_when: true
  tags:
    - config-base
    - config-packages

- name: Brew Update
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: brew update
  changed_when: false
  tags:
    - config-base
    - config-packages

- name: Brew Install
  become: true
  become_user: "{{ ansible_user }}"
  community.general.homebrew:
    name:
      - bash-completion
      - cmake
      - curl
      - direnv
      - fzf
      - gh
      - git
      - gnu-getopt
      - graphviz
      - hadolint
      - imagemagick
      - jq
      - libmagic
      - llvm
      - memcached
      - mise
      - neovim
      - openssl
      - pandoc
      - pinentry-mac
      - protobuf
      - python
      - readline
      - reattach-to-user-namespace
      - tig
      - tmux
      - translate-shell
      - trivy
      - vim
      - wget
      - yq
      # AVR
      - avr-gcc
      - avrdude
      - dfu-programmer
      - gcc-arm-none-eabi
      # ctags
      - universal-ctags
      # evans
      - evans
    state: latest
  tags:
    - config-base
    - config-packages

# mysql keeps 181MB of data under var/mysql and the installed 9.0.x is many majors
# behind current. An in-place jump that far leaves a server that will not start, so this
# one stays put and is upgraded by hand with the data migration it needs.
- name: Brew Install (pinned)
  become: true
  become_user: "{{ ansible_user }}"
  community.general.homebrew:
    name:
      - mysql
    state: present
  tags:
    - config-base
    - config-packages

# greedy is deliberately left at its default: 15 of these casks set auto_updates, so
# brew skips them here and lets each app update itself rather than fighting its updater.
- name: Install Homebrew cask packages
  become: true
  become_user: "{{ ansible_user }}"
  community.general.homebrew_cask:
    name:
      - deepl
      - discord
      - docker
      - firefox
      - ghostty
      - gitify
      - grammarly
      - google-japanese-ime
      - google-chrome
      - kindle
      - kitematic
      - licecap
      - postman
      - raycast
      - rstudio
      - sequel-pro
      - slack
      - spectacle
      - spotify
      - vagrant
      - visual-studio-code
      - vlc
      - xquartz
      - wireshark
    state: latest
    # upgrading a cask with privileged files (docker-desktop, wireshark, xquartz) makes
    # brew call sudo, which has no terminal to prompt from inside a task. An empty answer
    # at the prompt is omitted rather than passed on, so hosts with passwordless sudo keep
    # working instead of handing brew a blank password.
    sudo_password: "{{ ansible_become_pass | default(omit, true) }}"
  tags:
    - config-base
    - config-packages
