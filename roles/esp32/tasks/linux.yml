---
- name: Set nightly channel as cargo defualt
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: bash -lc "rustup default nightly"
  changed_when: false
  tags:
    - config-iot
    - config-esp32

- name: Ensure a temporary directory for esp-idf download
  become: true
  ansible.builtin.tempfile:
    state: directory
  register: esp32_esp_idf_temp_dir
  tags:
    - config-iot
    - config-esp32

- name: Fetch esp-idf
  become: true
  ansible.builtin.git: # noqa: latest
    repo: https://github.com/espressif/esp-idf
    dest: "{{ esp32_esp_idf_temp_dir.path }}/esp-idf"
  tags:
    - config-iot
    - config-esp32

- name: Install esp-idf
  become: true
  ansible.builtin.command:
    cmd: ./install.sh all
    chdir: "{{ esp32_esp_idf_temp_dir.path }}/esp-idf"
  changed_when: false
  tags:
    - config-iot
    - config-esp32

- name: Install rust-src
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: bash -lc "rustup toolchain install nightly --component rust-src"
  changed_when: false
  tags:
    - config-iot
    - config-esp32

- name: Install cargo-binutils
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: bash -lc "cargo install cargo-binutils"
  changed_when: false
  tags:
    - config-iot
    - config-esp32

- name: Install llvm-tools-preview
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: bash -lc "rustup toolchain install nightly --component llvm-tools-preview"
  changed_when: false
  tags:
    - config-iot
    - config-esp32

- name: Install cargo-generate
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: bash -lc "cargo install cargo-generate"
  changed_when: false
  tags:
    - config-iot
    - config-esp32

- name: Add RISC-V target
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: bash -lc "rustup target add {{ item }}"
  with_items:
    - riscv32imc-unknown-none-elf # For ESP32-C2 and ESP32-C3
    - riscv32imac-unknown-none-elf # For ESP32-C6 and ESP32-H2
  changed_when: false
  tags:
    - config-iot
    - config-esp32

- name: Install espup
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: bash -lc "cargo install espup"
  environment:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  changed_when: false
  tags:
    - config-iot
    - config-esp32

# Upstream rustup ships no prebuilt std for the Xtensa targets (ESP32, ESP32-S2, ESP32-S3),
# so `rustup target add` cannot install them. espup installs Espressif's forked toolchain,
# which carries them, as the rustup toolchain "esp".
# https://docs.espressif.com/projects/rust/book/getting-started/toolchain.html
- name: Install Xtensa toolchain
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command:
    cmd: bash -lc "espup install"
    creates: "{{ esp32_ansible_home }}/.rustup/toolchains/esp"
  tags:
    - config-iot
    - config-esp32

- name: Install espressif toolchain
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: bash -lc "cargo install {{ item }}"
  with_items:
    - ldproxy
    - espflash
    - cargo-espflash
    - espmonitor
  environment:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  changed_when: false
  tags:
    - config-iot
    - config-esp32
