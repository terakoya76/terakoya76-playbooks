---
- name: Install dependencies for esp-idf
  become: true
  ansible.builtin.apt:
    name:
      - git
      - wget
      - flex
      - bison
      - gperf
      - python3
      - python3-pip
      - python3-venv
      - cmake
      - ninja-build
      - ccache
      - libffi-dev
      - libssl-dev
      - dfu-util
      - libusb-1.0-0
    state: present
  tags:
    - config-iot
    - config-esp32

- name: Install dependencies
  become: true
  ansible.builtin.apt:
    name:
      - gcc
      - build-essential
      - curl
      - pkg-config
    state: present
  tags:
    - config-iot
    - config-esp32

- name: Install espflash dependencies
  become: true
  ansible.builtin.apt:
    name:
      - libuv1-dev
    state: present
  tags:
    - config-iot
    - config-esp32
