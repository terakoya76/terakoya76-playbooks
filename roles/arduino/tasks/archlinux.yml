---
- name: Install Arduino
  become: true
  become_user: "{{ aur_builder }}"
  vars:
    ansible_python_interpreter: "{{ aur_builder_python_interpreter }}"
  kewlfft.aur.aur:
    name: arduino-ide-bin
    use: paru
    state: present
  tags:
    - config-iot
    - config-arduino

# The snap reaches serial ports through its own interface; a native install needs the
# user in uucp, which owns /dev/ttyACM* and /dev/ttyUSB* on Arch.
- name: Join uucp group for USB serial
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: uucp
    append: true
  tags:
    - config-iot
    - config-arduino
