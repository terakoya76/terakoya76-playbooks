---
- name: Install kubectl, helm and sops dependencies
  ansible.builtin.import_role:
    name: packages
    tasks_from: archlinux_pacman_install
  vars:
    packages_archlinux_names:
      - kubectl
      - helm
      - age
      - gnupg
  tags:
    - config-tools
    - config-kubernetes

# Unlike Ubuntu, Arch has no /usr/share/keyrings for linux.yml to place the helm-secrets key in.
- name: Create keyrings directory
  become: true
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"
  tags:
    - config-tools
    - config-kubernetes
