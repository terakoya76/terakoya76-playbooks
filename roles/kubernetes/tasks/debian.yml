---
- name: Add kubernetes apt signing key
  become: true
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: "0644"
    force: true
  tags:
    - config-tools
    - config-kubernetes

- name: Add kubernetes apt source
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /"
    filename: kubernetes
    state: present
  tags:
    - config-tools
    - config-kubernetes

- name: Install kubectl
  become: true
  ansible.builtin.apt:
    name: kubectl
    state: present
    update_cache: true
  when: not ansible_check_mode
  tags:
    - config-tools
    - config-kubernetes

- name: Install sops dependencies
  become: true
  ansible.builtin.apt:
    name:
      - age
      - gnupg
    state: present
  tags:
    - config-tools
    - config-kubernetes

- name: Add helm apt signing key
  become: true
  ansible.builtin.get_url:
    url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
    dest: /etc/apt/keyrings/helm.asc
    mode: "0644"
    force: true
  tags:
    - config-tools
    - config-kubernetes

- name: Add helm apt source
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ kubernetes_arch_result.stdout }} signed-by=/etc/apt/keyrings/helm.asc] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
    filename: helm
    state: present
  tags:
    - config-tools
    - config-kubernetes

- name: Install helm
  become: true
  ansible.builtin.apt:
    name: helm
    state: present
    update_cache: true
  when: not ansible_check_mode
  tags:
    - config-tools
    - config-kubernetes
