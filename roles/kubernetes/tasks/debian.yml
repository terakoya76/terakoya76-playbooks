---
- name: Add kubernetes apt signing key
  become: true
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: "0644"
    force: true
  tags:
    - config-tools
    - config-kubernetes

- name: Add kubernetes apt source
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /"
    filename: kubernetes
    state: present
  tags:
    - config-tools
    - config-kubernetes

- name: Install kubectl
  become: true
  ansible.builtin.apt:
    name: kubectl
    state: present
    update_cache: true
  when: not ansible_check_mode
  tags:
    - config-tools
    - config-kubernetes

- name: Ensure a temporary directory for krew download
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.tempfile:
    state: directory
  register: kubernetes_krew_temp_dir
  tags:
    - config-tools
    - config-kubernetes

- name: Install krew
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell:
    cmd: |
      set -e
      bin_name="krew-{{ kubernetes_os_result.stdout }}_{{ kubernetes_arch_result.stdout }}"
      asset_name="${bin_name}.tar.gz"
      curl -sLO "https://github.com/kubernetes-sigs/krew/releases/latest/download/${asset_name}"
      tar zxvf ${asset_name}
      ./${bin_name} install krew
      ./${bin_name} update
    chdir: "{{ kubernetes_krew_temp_dir.path }}"
  changed_when: false
  tags:
    - config-tools
    - config-kubernetes

- name: Install kubectl plugins
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: bash -lc "kubectl krew install {{ item }}"
  with_items:
    - ctx
    - ns
    - iexec
    - status
    - tree
    - view-secret
    - whoami
    - trace
    - neat
    - images
    - rolesum
    - get-all
    - ca-cert
    - resource-capacity
    - df-pv
  changed_when: false
  tags:
    - config-tools
    - config-kubernetes

- name: Install sops dependencies
  become: true
  ansible.builtin.apt:
    name:
      - age
      - gnupg
    state: present
  tags:
    - config-tools
    - config-kubernetes

- name: Add helm apt signing key
  become: true
  ansible.builtin.get_url:
    url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
    dest: /etc/apt/keyrings/helm.asc
    mode: "0644"
    force: true
  tags:
    - config-tools
    - config-kubernetes

- name: Add helm apt source
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ kubernetes_arch_result.stdout }} signed-by=/etc/apt/keyrings/helm.asc] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
    filename: helm
    state: present
  tags:
    - config-tools
    - config-kubernetes

- name: Install helm
  become: true
  ansible.builtin.apt:
    name: helm
    state: present
    update_cache: true
  when: not ansible_check_mode
  tags:
    - config-tools
    - config-kubernetes

- name: Check helm-secrets plugin
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: bash -lc "helm secrets -h"
  register: kubernetes_helm_secrets_installed
  changed_when: false
  ignore_errors: true
  tags:
    - config-tools
    - config-kubernetes

- name: Install helm-secrets plugin
  become: true
  ansible.builtin.command: |
    helm plugin install https://github.com/jkroepke/helm-secrets
  when: kubernetes_helm_secrets_installed | failed
  changed_when: true
  tags:
    - config-tools
    - config-kubernetes

- name: Update helm-secrets plugin
  become: true
  ansible.builtin.command: helm plugin update secrets
  when: kubernetes_helm_secrets_installed | success
  changed_when: false
  tags:
    - config-tools
    - config-kubernetes

- name: Check helm-diff plugin
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: bash -lc "helm diff -h"
  register: kubernetes_helm_diff_installed
  changed_when: false
  ignore_errors: true
  tags:
    - config-tools
    - config-kubernetes

- name: Install helm-diff plugin
  become: true
  ansible.builtin.command: |
    helm plugin install https://github.com/databus23/helm-diff
  changed_when: false
  when: kubernetes_helm_diff_installed | failed
  tags:
    - config-tools
    - config-kubernetes

- name: Update helm-diff plugin
  become: true
  ansible.builtin.command: helm plugin update diff
  changed_when: false
  when: kubernetes_helm_diff_installed | success
  tags:
    - config-tools
    - config-kubernetes
