---
- name: Add kubernetes apt signing key
  become: true
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: "0644"
    force: true
  tags:
    - config-tools
    - config-kubernetes

- name: Add kubernetes apt source
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /"
    filename: kubernetes
    state: present
  tags:
    - config-tools
    - config-kubernetes

- name: Install kubectl
  become: true
  ansible.builtin.apt:
    name: kubectl
    state: present
    update_cache: true
  when: not ansible_check_mode
  tags:
    - config-tools
    - config-kubernetes

- name: Ensure a temporary directory for krew download
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.tempfile:
    state: directory
  register: kubernetes_krew_temp_dir
  tags:
    - config-tools
    - config-kubernetes

- name: Install krew
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell:
    cmd: |
      set -e
      bin_name="krew-{{ kubernetes_os_result.stdout }}_{{ kubernetes_arch_result.stdout }}"
      asset_name="${bin_name}.tar.gz"
      curl -sLO "https://github.com/kubernetes-sigs/krew/releases/latest/download/${asset_name}"
      tar zxvf ${asset_name}
      ./${bin_name} install krew
      ./${bin_name} update
    chdir: "{{ kubernetes_krew_temp_dir.path }}"
  changed_when: false
  tags:
    - config-tools
    - config-kubernetes

- name: Install kubectl plugins
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: bash -lc "kubectl krew install {{ item }}"
  with_items:
    - ctx
    - ns
    - iexec
    - status
    - tree
    - view-secret
    - whoami
    - trace
    - neat
    - images
    - rolesum
    - get-all
    - ca-cert
    - resource-capacity
    - df-pv
  changed_when: false
  tags:
    - config-tools
    - config-kubernetes

- name: Install sops dependencies
  become: true
  ansible.builtin.apt:
    name:
      - age
      - gnupg
    state: present
  tags:
    - config-tools
    - config-kubernetes

- name: Add helm apt signing key
  become: true
  ansible.builtin.get_url:
    url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
    dest: /etc/apt/keyrings/helm.asc
    mode: "0644"
    force: true
  tags:
    - config-tools
    - config-kubernetes

- name: Add helm apt source
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ kubernetes_arch_result.stdout }} signed-by=/etc/apt/keyrings/helm.asc] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
    filename: helm
    state: present
  tags:
    - config-tools
    - config-kubernetes

- name: Install helm
  become: true
  ansible.builtin.apt:
    name: helm
    state: present
    update_cache: true
  when: not ansible_check_mode
  tags:
    - config-tools
    - config-kubernetes

- name: Place helm-secrets signing key
  become: true
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://github.com/jkroepke.gpg | gpg --batch --yes --dearmor -o /usr/share/keyrings/jkroepke.gpg
  changed_when: false
  tags:
    - config-tools
    - config-kubernetes

# Helm 4 splits helm-secrets into three plugins (command, getter, post-renderer).
# A pre-Helm 4 install is registered as a getter only, so `helm secrets` is missing
# and the old plugin has to be removed before installing the split packages.
# https://github.com/jkroepke/helm-secrets/wiki/Installation
- name: Install helm-secrets plugins
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      set -e
      installed() { helm plugin list | awk 'NR > 1 { print $1 }' | grep -qx "$1"; }
      if ! helm secrets -h >/dev/null 2>&1 && installed secrets; then
        helm plugin uninstall secrets
      fi
      for plugin in secrets secrets-getter secrets-post-renderer; do
        if ! installed "${plugin}"; then
          helm plugin install --keyring /usr/share/keyrings/jkroepke.gpg "oci://ghcr.io/jkroepke/helm-secrets/${plugin}:latest"
          echo "installed ${plugin}"
        fi
      done
  register: kubernetes_helm_secrets_result
  changed_when: "'installed ' in kubernetes_helm_secrets_result.stdout"
  tags:
    - config-tools
    - config-kubernetes

- name: Check helm-diff plugin
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: helm diff version
  register: kubernetes_helm_diff_installed
  changed_when: false
  failed_when: false
  tags:
    - config-tools
    - config-kubernetes

- name: Install helm-diff plugin
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: helm plugin install https://github.com/databus23/helm-diff
  changed_when: true
  when: kubernetes_helm_diff_installed.rc != 0
  tags:
    - config-tools
    - config-kubernetes

- name: Update helm-diff plugin
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: helm plugin update diff
  changed_when: false
  when: kubernetes_helm_diff_installed.rc == 0
  tags:
    - config-tools
    - config-kubernetes
