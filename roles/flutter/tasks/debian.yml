---
- name: Point flutter at the snap android-studio
  ansible.builtin.set_fact:
    flutter_android_studio_dir: "{{ flutter_debian_android_studio_dir }}"
    flutter_java_home_path: "{{ flutter_debian_java_home_path }}"
  tags:
    - config-language
    - config-flutter

- name: Install flutter
  become: true
  community.general.snap:
    name: flutter
    state: present
    classic: true
  tags:
    - config-language
    - config-flutter

- name: Install android-studio
  become: true
  community.general.snap:
    name: android-studio
    state: present
    classic: true
  tags:
    - config-language
    - config-flutter

- name: Install dependencies for android-studio
  become: true
  ansible.builtin.apt:
    name:
      - libc6:i386
      - libncurses6:i386
      - libstdc++6:i386
      - lib32z1
      - libbz2-1.0:i386
    state: present
  tags:
    - config-language
    - config-flutter

# https://developer.android.com/studio/run/emulator-acceleration#accel-vm
# https://developer.android.com/studio/run/emulator-acceleration#vm-linux
- name: Setup VM Accelaration
  become: true
  ansible.builtin.apt:
    name:
      - cpu-checker
      - qemu-system-x86
      - libvirt-daemon-system
      - libvirt-clients
      - bridge-utils
    state: present
  tags:
    - config-language
    - config-flutter

- name: Setup Remote Debugging
  become: true
  ansible.builtin.apt:
    name:
      - adb
    state: present
  tags:
    - config-language
    - config-flutter
