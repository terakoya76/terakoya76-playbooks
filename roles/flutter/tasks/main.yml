---
- name: Get ansible_user home directory (Linux)
  ansible.builtin.shell: 'set -o pipefail && getent passwd "{{ ansible_user }}" | cut -d: -f6'
  register: flutter_ansible_home_result_linux
  changed_when: false
  when:
    - ansible_facts.system == "Linux"
  tags:
    - config-language
    - config-flutter

- name: Get ansible_user home directory (Darwin)
  ansible.builtin.shell: set -o pipefail && finger "{{ ansible_user }}" | awk '/^Directory/ {print $2}'
  register: flutter_ansible_home_result_darwin
  changed_when: false
  when:
    - ansible_facts.os_family == "Darwin"
  tags:
    - config-language
    - config-flutter

- name: Set the fact for the other scripts to use
  ansible.builtin.set_fact:
    flutter_ansible_home: "{{ flutter_ansible_home_result_linux.stdout | default(flutter_ansible_home_result_darwin.stdout | default('')) }}"
  changed_when: false
  when: (flutter_ansible_home_result_linux.stdout is defined) or (flutter_ansible_home_result_darwin.stdout is defined)
  tags:
    - config-language
    - config-flutter

- name: Get os in lowercase
  ansible.builtin.shell: set -o pipefail && uname | tr '[:upper:]' '[:lower:]'
  register: flutter_os_result
  changed_when: false
  tags:
    - config-language
    - config-flutter

- name: Get target arch
  ansible.builtin.shell: set -o pipefail && uname -m | sed -e 's/x86_64/amd64/' -e 's/\(arm\)\(64\)\?.*/\1\2/' -e 's/aarch64$/arm64/'
  register: flutter_arch_result
  changed_when: false
  tags:
    - config-language
    - config-flutter

- name: For debian
  ansible.builtin.import_tasks: debian.yml
  when:
    - ansible_facts.os_family == "Debian"

- name: For archlinux
  ansible.builtin.import_tasks: archlinux.yml
  when:
    - ansible_facts.os_family == "Archlinux"

- name: For linux
  ansible.builtin.import_tasks: linux.yml
  when:
    - ansible_facts.system == "Linux"

- name: For darwin
  ansible.builtin.import_tasks: darwin.yml
  when:
    - ansible_facts.os_family == "Darwin"
