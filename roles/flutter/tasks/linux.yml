---
- name: Mkdir for android sdk
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.file:
    path: "{{ flutter_ansible_home }}/Android/Sdk"
    state: directory
    mode: "0775"
  tags:
    - config-language
    - config-flutter

- name: Configure flutter
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: "flutter config {{ item }}"
  with_items:
    - --android-sdk "{{ flutter_ansible_home }}/Android/Sdk/"
    - --android-studio-dir "{{ flutter_android_studio_dir }}"
  changed_when: false
  tags:
    - config-language
    - config-flutter

- name: Install fvm
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: dart pub global activate fvm
  changed_when: false
  environment:
    JAVA_HOME: "{{ flutter_java_home_path }}"
  tags:
    - config-language
    - config-flutter

- name: Place fvm.sh
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.template:
    src: files/fvm.sh
    dest: "{{ flutter_ansible_home }}/.bash.d/fvm.sh"
    mode: "0755"
  tags:
    - config-language
    - config-flutter

- name: Install Firebase CLI
  become: true
  ansible.builtin.shell: set -o pipefail && curl -sL https://firebase.tools | bash
  changed_when: false
  tags:
    - config-language
    - config-flutter

- name: Activate flutterfire CLI
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: dart pub global activate flutterfire_cli
  changed_when: false
  environment:
    JAVA_HOME: "{{ flutter_java_home_path }}"
  tags:
    - config-language
    - config-flutter
