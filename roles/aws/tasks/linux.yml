---
- name: Mkdir for aws config
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.file:
    path: "{{ aws_ansible_home }}/.aws"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags:
    - config-tools
    - config-aws

# Only seed the file: aws configure sso adds profiles to it, and overwriting would drop them
- name: Place aws/config for awscli
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.template:
    src: files/awsconfig
    dest: "{{ aws_ansible_home }}/.aws/config"
    mode: "0755"
    force: false
  tags:
    - config-tools
    - config-aws
