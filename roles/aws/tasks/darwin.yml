---
- name: Mkdir for aws config
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.file:
    path: "{{ aws_ansible_home }}/.aws"
    state: directory
    owner: "{{ ansible_user }}"
    group: staff
    mode: "0755"
  tags:
    - config-tools
    - config-aws

- name: Place aws/config for awscli
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.template:
    src: files/awsconfig
    dest: "{{ aws_ansible_home }}/.aws/config"
    mode: "0755"
    backup: true
  tags:
    - config-tools
    - config-aws

- name: Tap saml2aws
  become: true
  become_user: "{{ ansible_user }}"
  community.general.homebrew_tap:
    name: versent/homebrew-taps
    state: present
  tags:
    - config-tools
    - config-aws

- name: Install saml2aws
  become: true
  become_user: "{{ ansible_user }}"
  community.general.homebrew:
    name: saml2aws
    state: present
  tags:
    - config-tools
    - config-aws
