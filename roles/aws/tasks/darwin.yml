---
- name: Mkdir for aws config
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.file:
    path: "{{ aws_ansible_home }}/.aws"
    state: directory
    owner: "{{ ansible_user }}"
    group: staff
    mode: "0755"
  tags:
    - config-tools
    - config-aws

# Only seed the file: aws configure sso adds profiles to it, and overwriting would drop them
- name: Place aws/config for awscli
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.template:
    src: files/awsconfig
    dest: "{{ aws_ansible_home }}/.aws/config"
    mode: "0755"
    force: false
  tags:
    - config-tools
    - config-aws

- name: Tap saml2aws
  become: true
  become_user: "{{ ansible_user }}"
  community.general.homebrew_tap:
    name: versent/homebrew-taps
    state: present
  tags:
    - config-tools
    - config-aws

# Homebrew 7 refuses to load formulae from non-official taps until they are trusted
- name: Brew Trust Check
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: brew trust --json v1
  register: aws_brew_trust_result
  changed_when: false
  check_mode: false
  tags:
    - config-tools
    - config-aws

- name: Trust saml2aws tap
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: brew trust --tap versent/taps
  when: "'versent/taps' not in (aws_brew_trust_result.stdout | from_json).taps"
  changed_when: true
  tags:
    - config-tools
    - config-aws

- name: Install saml2aws
  become: true
  become_user: "{{ ansible_user }}"
  community.general.homebrew:
    name: saml2aws
    state: present
  tags:
    - config-tools
    - config-aws
