min_version = "2025.12.0"

[tools]
#----------------------
# node
#----------------------
node = "26"
"aqua:pnpm/pnpm" = "12"
"npm:neovim" = "latest"
"npm:@antfu/ni" = "latest"
"npm:taze" = "latest"
# linter
"npm:knip" = "latest"
"npm:depcheck" = "latest"
"npm:ts-prune" = "latest"
# coding agent
"npm:@anthropic-ai/claude-code" = { version = "latest", allow_builds = ["@anthropic-ai/claude-code"] }
"npm:happy-coder" = "latest"
"npm:skills" = "latest"

#----------------------
# python
#----------------------
python = "3"
"aqua:astral-sh/uv" = "latest"
"pypi:ruff" = "latest"
"pypi:openai-whisper" = { version = "latest", os = ["linux"] }

#----------------------
# ruby
#----------------------
ruby = "4"

#----------------------
# go
#----------------------
go = "1"
"go:github.com/air-verse/air" = "latest"
"go:github.com/golangci/golangci-lint/cmd/golangci-lint" = "latest"
"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"go:github.com/spf13/cobra-cli" = "latest"
"go:github.com/x-motemen/ghq" = "latest"
"go:github.com/d-kuro/gwq/cmd/gwq" = "latest"
"go:github.com/tomasz-tomczyk/crit/cmd/crit" = "latest"

#----------------------
# protobuf
#----------------------
"go:github.com/golang/protobuf/protoc-gen-go" = "latest"
"go:github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc" = "latest"
"go:github.com/ktr0731/evans" = "latest"

#----------------------
# aws
#----------------------
"aqua:aws/aws-cli" = "latest"
"aqua:eksctl-io/eksctl" = "latest"
"pypi:awsebcli" = "latest"
# lsec2 only publishes x86_64 binaries
"github:goldeneggg/lsec2" = { version = "latest", os = ["linux/x64", "macos/x64"] }

#----------------------
# kubernetes
#----------------------
"aqua:kubernetes-sigs/kustomize" = "latest"
"aqua:bitnami/sealed-secrets" = "latest"
"aqua:stern/stern" = "latest"
"aqua:getsops/sops" = "latest"
"aqua:helmfile/helmfile" = "latest"
# sopsed only publishes a single macOS x86_64 binary
"github:mumoshu/sopsed" = { version = "latest", asset_pattern = "sopsed", os = ["macos/x64"] }

#----------------------
# terraform
#----------------------
"aqua:hashicorp/terraform" = "latest"
"go:github.com/plumber-cd/terraform-backend-git" = "latest"
"go:github.com/terraform-docs/terraform-docs" = "latest"

#----------------------
# cli
#----------------------
"aqua:sharkdp/bat" = "latest"
"aqua:dandavison/delta" = "latest"
"github:cargo-generate/cargo-generate" = "latest"
# eza ships no macOS binaries and tokei none for Linux, so both build with the rustup toolchain
"cargo:eza" = "latest"
"cargo:tokei" = "latest"

#----------------------
# nvim
#----------------------
"aqua:herdrdev/herdr" = "latest"
"aqua:sharkdp/fd" = "latest"
"aqua:o2sh/onefetch" = "latest"
"aqua:BurntSushi/ripgrep" = "latest"
# nvim-treesitter (main branch) builds parsers with tree-sitter-cli >= 0.26.1; apt ships 0.25,
# and Homebrew's tree-sitter formula is library-only (the CLI moved to tree-sitter-cli).
"aqua:tree-sitter/tree-sitter" = "latest"
"pypi:powerline-shell" = "latest"
# neovide only ships a .dmg for macOS
"github:neovide/neovide" = { version = "latest", os = ["linux"] }
# universal-ctags only ships native builds via ctags-nightly-build (no macOS; the packages role installs it with Homebrew there)
"github:universal-ctags/ctags-nightly-build" = { version = "latest", asset_pattern = "uctags-*-linux-x86_64.release.tar.gz", strip_components = 1, bin_path = "bin", os = ["linux/x64"] }

#----------------------
# streamdeck
#----------------------
"pypi:streamdeck-linux-gui" = { version = "latest", os = ["linux"] }

[env]
#----------------------
# node
#----------------------
# This will make CLIs installed with npm available without npx.
_.path = ["{{config_root}}/node_modules/.bin"]

[settings]
fetch_remote_versions_timeout = "60s"

[settings.aqua]
baked_registry = false
