---
- name: Get ansible_user home directory (Linux)
  ansible.builtin.shell: 'set -o pipefail && getent passwd "{{ ansible_user }}" | cut -d: -f6'
  register: dotfiles_ansible_home_result_linux
  changed_when: false
  when:
    - ansible_facts.system == "Linux"
  tags:
    - config-base
    - config-dotfiles

- name: Get ansible_user home directory (Darwin)
  ansible.builtin.shell: set -o pipefail && finger "{{ ansible_user }}" | awk '/^Directory/ {print $2}'
  register: dotfiles_ansible_home_result_darwin
  changed_when: false
  when:
    - ansible_facts.os_family == "Darwin"
  tags:
    - config-base
    - config-dotfiles

- name: Set the fact for the other scripts to use
  ansible.builtin.set_fact:
    dotfiles_ansible_home: "{{ dotfiles_ansible_home_result_linux.stdout | default(dotfiles_ansible_home_result_darwin.stdout | default('')) }}"
  changed_when: false
  when: (dotfiles_ansible_home_result_linux.stdout is defined) or (dotfiles_ansible_home_result_darwin.stdout is defined)
  tags:
    - config-base
    - config-dotfiles

- name: For all
  ansible.builtin.import_tasks: common.yml

- name: For debian
  ansible.builtin.import_tasks: debian.yml
  when:
    - ansible_facts.os_family == "Debian"

- name: For archlinux
  ansible.builtin.import_tasks: archlinux.yml
  when:
    - ansible_facts.os_family == "Archlinux"

- name: For linux
  ansible.builtin.import_tasks: linux.yml
  when:
    - ansible_facts.system == "Linux"

- name: For darwin
  ansible.builtin.import_tasks: darwin.yml
  when:
    - ansible_facts.os_family == "Darwin"
