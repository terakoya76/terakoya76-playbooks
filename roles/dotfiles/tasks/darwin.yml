---
- name: Place Default Config
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.template:
    src: files/{{ item }}
    dest: "{{ dotfiles_ansible_home }}/.{{ item }}"
    mode: "0755"
    backup: true
  with_items:
    # - zshrc
    - bash_profile
    - bashrc
  tags:
    - config-base
    - config-dotfiles

- name: Install bash-completion
  become: true
  become_user: "{{ ansible_user }}"
  community.general.homebrew:
    name:
      - bash-completion
    state: present
  tags:
    - config-base
    - config-dotfiles

- name: Create target directory for gnupg
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.file:
    path: "{{ dotfiles_ansible_home }}/.gnupg"
    state: directory
    mode: "0700"
  tags:
    - config-base
    - config-dotfiles

# bash.d/gpg.sh sets GPG_TTY for the terminal pinentry, but that one fails wherever the
# terminal cannot host the prompt (small or absent TTY). pinentry-mac prompts via the GUI.
- name: Use pinentry-mac for gpg-agent
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.lineinfile:
    path: "{{ dotfiles_ansible_home }}/.gnupg/gpg-agent.conf"
    regexp: '^pinentry-program '
    line: pinentry-program /opt/homebrew/bin/pinentry-mac
    create: true
    mode: "0600"
  notify: Restart gpg-agent
  tags:
    - config-base
    - config-dotfiles
